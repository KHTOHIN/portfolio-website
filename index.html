<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kawsar Hamid | Software Engineer & System Architect</title>
    <meta name="description" content="Portfolio of Kawsar Hamid — Software Engineer specializing in Government & Enterprise systems, SQL optimization, PHP, Laravel, Java Spring Boot, and scalable architecture." />
    <meta name="theme-color" content="#0a0e1a" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            },
            colors: {
              cyber: {
                dark: '#0a0e1a',
                darker: '#060a14',
                card: '#0f1525',
                cardHover: '#141d33',
                border: '#1a2340',
                borderHover: '#2d3b66',
                accent: '#00f0ff',
                accentDim: '#00a0aa',
                accentGlow: 'rgba(0, 240, 255, 0.15)',
                text: '#94a3b8',
                heading: '#f1f5f9',
              },
              light: {
                bg: '#f8fafc',
                card: '#ffffff',
                cardHover: '#f1f5f9',
                border: '#e2e8f0',
                borderHover: '#cbd5e1',
                accent: '#0891b2',
                accentDim: '#0e7490',
                accentGlow: 'rgba(8, 145, 178, 0.12)',
                text: '#475569',
                heading: '#0f172a',
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'spin-slow': 'spin 20s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
      
      /* Subtle Grid Backgrounds */
      .bg-grid-pattern-dark {
        background-size: 32px 32px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      }
      .bg-grid-pattern-light {
        background-size: 32px 32px;
        background-image: 
          linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
      }
      .bg-dots-pattern {
        background-image: radial-gradient(rgba(0, 240, 255, 0.12) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #060a14;
      }
      ::-webkit-scrollbar-thumb {
        background: #1a2340;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f0ff;
      }

      /* Glassmorphism utility */
      .glass-card-dark {
        background: rgba(15, 21, 37, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .glass-card-light {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      /* Glowing borders */
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 8px rgba(0,240,255,0.25); }
        50% { box-shadow: 0 0 24px rgba(0,240,255,0.55); }
      }
      .glow-border {
        animation: pulse-glow 3s ease-in-out infinite;
      }

      .sidebar-link {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }
    </style>

{

}
</script>
